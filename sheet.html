<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuzzy Buddies Lineup</title>
<style>
  body { margin: 0; padding: 20px; background: #edf2f5; font: 13px ui-monospace, Menlo, monospace; color: #1c2331; }
  h1 { font: 700 20px system-ui, sans-serif; margin: 0 0 16px; }
  .row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; margin-bottom: 12px; }
  .row header h2 { font: 700 18px system-ui, sans-serif; margin: 0; }
  .row header p { margin: 4px 0 0; color: #5b6577; font: 12px system-ui, sans-serif; }
  .cells { display: flex; gap: 8px; flex-wrap: wrap; }
  figure { margin: 0; background: #fff; border: 1px solid #d5dde5; border-radius: 10px; }
  figcaption { text-align: center; padding: 0 0 6px; color: #5b6577; font-size: 11px; }
</style>
</head>
<body>
<h1>Fuzzy Buddies starter lineup</h1>
<div id="grid"></div>
